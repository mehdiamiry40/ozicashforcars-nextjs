name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build and test
        run: npm test

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Test quote form in the browser
        run: npm run test:browser

  outbox:
    name: Isolated outbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quote_ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U quote_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # These credentials exist only in this ephemeral service. No repository,
      # deployment or provider secrets are made available to this job.
      OUTBOX_TEST_POSTGRES_URL: postgresql://quote_ci:local-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test durable quote delivery
        run: npm run test:outbox
