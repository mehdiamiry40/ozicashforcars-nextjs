name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Install locked dependencies
        run: npm ci

      # Production dependencies only. braces (GHSA-vfj7-8cjw-p6xm) comes in
      # through eslint-config-next, has no patched release, and the only
      # audit --force fix downgrades eslint-config-next to 14.x. High and
      # critical production advisories still fail this step.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build and test
        run: npm test

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Test quote form in the browser
        run: npm run test:browser
