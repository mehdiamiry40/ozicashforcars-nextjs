name: Quote delivery health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: quote-delivery-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Check the production queue without sending mail
        env:
          QUOTE_MONITOR_ORIGIN: ${{ vars.QUOTE_MONITOR_ORIGIN }}
          QUOTE_MONITOR_SECRET: ${{ secrets.QUOTE_MONITOR_SECRET }}
        run: node scripts/check-quote-health.mjs
